[project]
name = "electricity-map-api"
version = "0.1.0"
description = "API pública del mapa eléctrico de España"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "electricity-map-domain",
    "pydantic>=2.11,<3",
    "sqlalchemy>=2.0,<2.1",
    "turso-serverless==0.1.0",
    "uvicorn[standard]>=0.34.0",
]

[project.scripts]
build-distribution-database = "electricity_map_api.distribution.store:main"

[tool.uv.sources]
electricity-map-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
