[project]
name = "electricity-map-ingestion"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["electricity-map-domain", "pydantic>=2.10"]

[project.scripts]
ingest-cnmc-electricity = "electricity_map_ingestion.cnmc_electricity:main"
refresh-cnmc-electricity = "electricity_map_ingestion.refresh_cnmc_electricity:main"
ingest-gas-distribution = "electricity_map_ingestion.gas_distribution:main"
ingest-gas-retail = "electricity_map_ingestion.gas_retail:main"

[tool.uv.sources]
electricity-map-domain = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
